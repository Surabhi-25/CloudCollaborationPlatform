version: '3.8'

services:
  # --- 1. Auth Service (External Port 8081) ---
  auth-service:
    build: .
    container_name: auth-service
    ports:
      - "8081:80"
    # CRITICAL: Mounts the local code into the container so file changes are visible.
    volumes:
      - .:/app
    environment:
      SERVICE_PORT: 80
    # Uses 'sh -c' and '--reload' to automatically pick up file changes.
    command: sh -c "uvicorn auth_service:app --host 0.0.0.0 --port 80 --reload"
    restart: always

  # --- 2. Metadata Service (External Port 8082) ---
  metadata-service:
    build: .
    container_name: metadata-service
    ports:
      - "8082:80"
    volumes:
      - .:/app
    environment:
      SERVICE_PORT: 80
    command: sh -c "uvicorn metadata_service:app --host 0.0.0.0 --port 80 --reload"
    restart: always

  # --- 3. File Handler Service (External Port 8083) ---
  file-handler-service:
    build: .
    container_name: file-handler-service
    ports:
      - "8083:80"
    volumes:
      - .:/app
    environment:
      SERVICE_PORT: 80
      # CRITICAL: This is how the file handler finds the metadata service
      METADATA_SERVICE_URL: http://metadata-service:80
    command: sh -c "uvicorn file_handler_service:app --host 0.0.0.0 --port 80 --reload"
    restart: always
    depends_on:
      - auth-service
      - metadata-service
